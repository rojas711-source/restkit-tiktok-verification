<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RestKit TikTok Callback</title>
    <style>
      body {
        margin: 0;
        background: #f5f4ef;
        color: #22312d;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(760px, calc(100% - 32px));
        margin: 48px auto;
        padding: 28px;
        background: #fff;
        border: 1px solid #d9ded7;
        border-radius: 8px;
      }
      code {
        display: block;
        overflow-wrap: anywhere;
        padding: 12px;
        background: #eef2ec;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>TikTok Authorization Received</h1>
      <p>Return to the RestKit owner dashboard and paste this callback URL if requested.</p>
      <code id="callback-url"></code>
    </main>
    <script>
      document.getElementById("callback-url").textContent = window.location.href;
    </script>
  </body>
</html>
