<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RestKit TikTok Callback</title>
    <link rel="stylesheet" href="restkit.css">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="index.html" aria-label="RestKit home">
        <span class="brand-mark">RK</span>
        <span>
          <strong>RestKit</strong>
          <small>Sleep, travel, recovery</small>
        </span>
      </a>
      <nav class="nav" aria-label="RestKit TikTok pages">
        <a href="index.html">Overview</a>
        <a href="terms.html">Terms</a>
        <a href="privacy.html">Privacy</a>
      </nav>
    </header>

    <main class="legal">
      <article class="legal-card">
        <p class="eyebrow">TikTok authorization</p>
        <h1>Authorization received</h1>
        <p>Return to the RestKit owner dashboard and paste this callback URL if requested.</p>
        <code class="callback-code" id="callback-url"></code>
      </article>
    </main>

    <footer class="footer">
      <span>RestKit TikTok Uploader</span>
      <span>Owner-reviewed draft publishing</span>
    </footer>

    <script>
      document.getElementById("callback-url").textContent = window.location.href;
    </script>
  </body>
</html>
